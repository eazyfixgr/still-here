<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10150f">
  <meta name="description" content="One clock. A few milestones. A question for today. A quiet, local-first game about the one life you are actually living.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://eazyfixgr.github.io/still-here/">
  <meta property="og:site_name" content="Still Here">
  <meta property="og:title" content="Still Here — A quiet game about your one life">
  <meta property="og:description" content="See how many days you have already lived, keep a few milestones, and answer one small question. No sign-up. No streak.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eazyfixgr.github.io/still-here/">
  <meta property="og:image" content="https://eazyfixgr.github.io/still-here/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Still Here — Life moves. So do you.">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="el_GR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Still Here — A quiet game about your one life">
  <meta name="twitter:description" content="See how many days you have already lived, keep a few milestones, and answer one small question.">
  <meta name="twitter:image" content="https://eazyfixgr.github.io/still-here/og-image.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Still Here">
  <title>Still Here — A quiet game about your one life</title>
  <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="%BASE_URL%site.webmanifest">
  <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Still Here",
      "url": "https://eazyfixgr.github.io/still-here/",
      "description": "A quiet, local-first game about the time you have. See your days, keep milestones, seal messages and answer one question a day.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "inLanguage": ["en", "el"],
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
    }
  </script>
  <script>
    try {
      const prefs = JSON.parse(localStorage.getItem('stillhere.prefs.v2') || '{}');
      if (prefs.theme === 'light' || prefs.theme === 'dark') {
        document.documentElement.dataset.theme = prefs.theme;
        document.querySelector('meta[name="theme-color"]').content = prefs.theme === 'light' ? '#f4f2e8' : '#10150f';
      }
    } catch {}
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <noscript>
    <div class="no-script">Still Here needs JavaScript to run. Enable JavaScript and reopen this page.</div>
  </noscript>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-stack" role="status" aria-live="polite"></div>
</body>
</html>
